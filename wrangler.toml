name = "real-cost-calculator-india"
compatibility_date = "2024-11-01"
main = "worker.ts"

# Serve the Vite build output (run `pnpm build` before dev/deploy)
[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback: unknown paths serve index.html (for client-side routing)
not_found_handling = "single-page-application"

[observability]
enabled = true
